<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Universal Scale OCR - Fixed</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center p-4 select-none">

<div class="w-full max-w-md bg-gray-900 p-5 rounded-2xl shadow-2xl border border-gray-800 flex flex-col gap-4">
  <header class="flex items-center justify-between border-b border-gray-800 pb-3">
    <h1 class="text-base font-bold text-green-400 flex items-center gap-2"><span>⚖️</span> ระบบสแกนน้ำหนัก</h1>
    <span class="text-[11px] bg-emerald-950 text-emerald-400 border border-emerald-700/50 px-2 py-0.5 rounded font-mono">Fixed Pipeline</span>
  </header>

  <div class="relative w-full aspect-[4/3] bg-black rounded-xl overflow-hidden border-2 border-gray-700 shadow-inner">
    <video id="video" autoplay playsinline muted class="w-full h-full object-cover"></video>

    <div id="roiBox" class="absolute border-2 border-dashed border-green-400 rounded-lg pointer-events-none flex items-end justify-center pb-1 bg-green-500/10" style="width:80%;height:30%;left:10%;top:35%;">
      <span class="bg-black/80 text-green-300 text-[10px] px-2 py-0.5 rounded font-mono">🎯 คลุมเฉพาะตัวเลข</span>
    </div>

    <div id="previewOverlay" class="hidden absolute inset-0 bg-black/95 flex-col items-center justify-center p-4 gap-2 z-10">
      <span class="text-xs text-amber-400 font-mono">🔍 ภาพที่ Tesseract เห็น:</span>
      <canvas id="cropCanvas" class="border-2 border-amber-500 rounded-lg max-w-full max-h-32 shadow-lg bg-white"></canvas>
      <span id="rawOcrText" class="text-[11px] text-gray-300 font-mono text-center break-all px-2">กำลังประมวลผล...</span>
    </div>
  </div>

  <div class="bg-gray-950 p-3 rounded-xl border border-gray-800 flex flex-col gap-2">
    <div class="flex items-center justify-between text-xs text-gray-400 font-mono">
      <span>🎛️ ปรับขนาดกรอบ:</span>
      <span id="boxDimensionDisplay" class="text-green-400 font-bold">W: 80% | H: 30%</span>
    </div>
    <div class="grid grid-cols-2 gap-2 text-xs">
      <div class="flex items-center gap-1">
        <span class="text-gray-500 font-mono">กว้าง:</span>
        <button onclick="adjustBoxSize('w',-5)" class="bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded font-bold">-</button>
        <button onclick="adjustBoxSize('w',5)"  class="bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded font-bold">+</button>
      </div>
      <div class="flex items-center gap-1 justify-end">
        <span class="text-gray-500 font-mono">สูง:</span>
        <button onclick="adjustBoxSize('h',-5)" class="bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded font-bold">-</button>
        <button onclick="adjustBoxSize('h',5)"  class="bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded font-bold">+</button>
      </div>
    </div>
  </div>

  <div id="actionContainer">
    <button id="snapBtn" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] py-3.5 rounded-xl font-bold transition shadow-lg text-base">📸 Snap &amp; Extract Weight</button>
  </div>
  <div id="retakeContainer" class="hidden">
    <button id="retakeBtn" class="w-full bg-amber-600 hover:bg-amber-500 active:scale-[0.98] py-3.5 rounded-xl font-bold transition shadow-lg text-base">🔄 ถ่ายภาพใหม่ (Retake)</button>
  </div>

  <div class="flex flex-col gap-3">
    <label for="weightInput" class="text-xs text-gray-300 font-medium flex justify-between">
      <span>ค่าน้ำหนักที่สกัดได้ (แก้ไขได้):</span>
      <span class="text-green-400 font-mono text-[11px]">kg</span>
    </label>
    <input type="number" id="weightInput" step="0.001" inputmode="decimal" placeholder="0.00"
           class="w-full text-3xl font-mono text-center bg-gray-950 border-2 border-green-500 rounded-xl py-2.5 px-3 text-green-300 font-bold focus:outline-none focus:ring-2 focus:ring-green-400"/>
    <button id="submitBtn" class="w-full bg-green-600 hover:bg-green-500 active:scale-[0.98] py-3 rounded-xl font-bold transition shadow-lg">✅ ยืนยันส่งข้อมูล</button>
  </div>

  <p id="statusMsg" class="text-center text-xs text-gray-400 mt-2 font-mono min-h-[1rem]">ปรับกรอบให้ครอบตัวเลข แล้วกด Snap</p>
</div>

<div id="successModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
  <div class="bg-gray-900 border border-gray-700 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
    <div class="w-16 h-16 bg-green-500/20 text-green-400 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl border border-green-500/30">✓</div>
    <h2 class="text-xl font-bold mb-2">บันทึกข้อมูลสำเร็จ</h2>
    <p class="text-gray-300 text-base mb-6">น้ำหนักที่ส่งคือ
      <span id="modalWeightValue" class="text-2xl font-mono font-bold text-green-400 mx-1">0.00</span> kg</p>
    <button id="closeModalBtn" class="w-full bg-green-600 hover:bg-green-500 font-bold py-3 rounded-xl transition shadow-lg">ตกลง (เริ่มรอบถัดไป)</button>
  </div>
</div>

<script>
const els = {
  video: document.getElementById('video'),
  cropCanvas: document.getElementById('cropCanvas'),
  roiBox: document.getElementById('roiBox'),
  boxDimensionDisplay: document.getElementById('boxDimensionDisplay'),
  snapBtn: document.getElementById('snapBtn'),
  retakeBtn: document.getElementById('retakeBtn'),
  actionContainer: document.getElementById('actionContainer'),
  retakeContainer: document.getElementById('retakeContainer'),
  weightInput: document.getElementById('weightInput'),
  statusMsg: document.getElementById('statusMsg'),
  submitBtn: document.getElementById('submitBtn'),
  successModal: document.getElementById('successModal'),
  modalWeightValue: document.getElementById('modalWeightValue'),
  closeModalBtn: document.getElementById('closeModalBtn')
};

let boxWidth = 80, boxHeight = 30, isSnapped = false;

/* ---------- ROI ---------- */
function updateRoiBoxStyle() {
  if (isSnapped) return;
  els.roiBox.style.width  = boxWidth + '%';
  els.roiBox.style.height = boxHeight + '%';
  els.roiBox.style.left   = ((100 - boxWidth) / 2) + '%';
  els.roiBox.style.top    = ((100 - boxHeight) / 2) + '%';
  els.boxDimensionDisplay.textContent = `W: ${boxWidth}% | H: ${boxHeight}%`;
}
window.adjustBoxSize = function (type, delta) {
  if (isSnapped) return;
  if (type === 'w') boxWidth  = Math.min(95, Math.max(20, boxWidth + delta));
  else              boxHeight = Math.min(60, Math.max(8,  boxHeight + delta));
  updateRoiBoxStyle();
};

/* ---------- Camera ---------- */
async function initCamera() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    els.video.srcObject = s;
    await els.video.play().catch(() => {});
  } catch (e) {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      els.video.srcObject = s;
    } catch (err) {
      els.statusMsg.textContent = '⚠️ เปิดกล้องไม่ได้ (ต้อง https:// หรือ localhost)';
    }
  }
}

/* ---------- 7-segment templates ---------- */
const SEGMENTS = {
  '0': ['a','b','c','d','e','f'],
  '1': ['b','c'],
  '2': ['a','b','g','e','d'],
  '3': ['a','b','g','c','d'],
  '4': ['f','g','b','c'],
  '5': ['a','f','g','c','d'],
  '6': ['a','f','g','e','c','d'],
  '7': ['a','b','c'],
  '8': ['a','b','c','d','e','f','g'],
  '9': ['a','b','c','d','f','g']
};

const TW = 40, TH = 60;   // ขนาด template ที่ normalize

function makeTemplate(digit) {
  const c = document.createElement('canvas');
  c.width = TW; c.height = TH;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, TW, TH);
  ctx.fillStyle = '#fff';

  const t = Math.round(Math.min(TW, TH) * 0.16);
  const on = new Set(SEGMENTS[digit] || []);
  const rects = {
    a: [t, 0, TW - 2*t, t],
    b: [TW - t, t, t, TH/2 - t],
    c: [TW - t, TH/2 + Math.round(t/2), t, TH/2 - t],
    d: [t, TH - t, TW - 2*t, t],
    e: [0, TH/2 + Math.round(t/2), t, TH/2 - t],
    f: [0, t, t, TH/2 - t],
    g: [t, Math.round(TH/2 - t/2), TW - 2*t, t]
  };
  for (const [k, r] of Object.entries(rects)) {
    if (on.has(k)) ctx.fillRect(r[0], r[1], r[2], r[3]);
  }
  return c;
}
const TEMPLATES = {};
for (let d = 0; d <= 9; d++) TEMPLATES[d] = makeTemplate(d);

function normalizeTo(src, w, h) {
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const c = out.getContext('2d');
  c.imageSmoothingEnabled = true;
  c.drawImage(src, 0, 0, w, h);
  return out;
}

function score(a, b) {
  const w = a.width, h = a.height;
  const ad = a.getContext('2d').getImageData(0, 0, w, h).data;
  const bd = b.getContext('2d').getImageData(0, 0, w, h).data;
  let s = 0;
  for (let i = 0; i < ad.length; i += 4) s += Math.abs(ad[i] - bd[i]);
  return s / (w * h);
}

function recognizeDigit(region) {
  const norm = normalizeTo(region, TW, TH);
  let best = '?', bestScore = Infinity;
  for (const [d, tpl] of Object.entries(TEMPLATES)) {
    const sc = score(norm, tpl);
    if (sc < bestScore) { bestScore = sc; best = d; }
  }
  return { digit: best, confidence: Math.max(0, 1 - bestScore / 255) };
}

/* ---------- Main pipeline ---------- */
async function runTemplateMatching() {
  const v = els.video;
  if (!v.videoWidth || !v.videoHeight) {
    els.statusMsg.textContent = '⚠️ กล้องยังไม่พร้อม';
    return;
  }

  // map ROI -> video frame (object-fit: cover)
  const vw = v.videoWidth, vh = v.videoHeight;
  const cw = v.clientWidth, ch = v.clientHeight;
  const scale   = Math.max(cw / vw, ch / vh);
  const offsetX = (cw - vw * scale) / 2;
  const offsetY = (ch - vh * scale) / 2;

  const roiWpx = cw * boxWidth  / 100;
  const roiHpx = ch * boxHeight / 100;
  const roiXpx = (cw - roiWpx) / 2;
  const roiYpx = (ch - roiHpx) / 2;

  let sx = Math.max(0, Math.min(vw - 1, (roiXpx - offsetX) / scale));
  let sy = Math.max(0, Math.min(vh - 1, (roiYpx - offsetY) / scale));
  let sw = Math.max(1, Math.min(vw - sx, roiWpx / scale));
  let sh = Math.max(1, Math.min(vh - sy, roiHpx / scale));

  const src = document.createElement('canvas');
  src.width  = Math.round(sw);
  src.height = Math.round(sh);
  const sctx = src.getContext('2d', { willReadFrequently: true });
  sctx.drawImage(v, sx, sy, sw, sh, 0, 0, src.width, src.height);

  const W = src.width, H = src.height;
  const img = sctx.getImageData(0, 0, W, H);
  const d = img.data;

  // ---- 1. หา max brightness ----
  let maxB = 0;
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.max(d[i], d[i+1], d[i+2]);
    if (v > maxB) maxB = v;
  }
  if (maxB < 40) {
    els.statusMsg.textContent = '❌ ภาพมืดเกินไป / ไม่พบ LED';
    return;
  }

  // ---- 2. Binarize: bright -> white (digit), dark -> black (bg) ----
  const th = Math.max(80, maxB * 0.45);
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.max(d[i], d[i+1], d[i+2]);
    const val = v > th ? 255 : 0;
    d[i] = d[i+1] = d[i+2] = val;
    d[i+3] = 255;
  }
  sctx.putImageData(img, 0, 0);

  // ---- 3. Column projection: หาว่าคอลัมน์ไหนมี white pixels ----
  const colInk = new Array(W).fill(0);
  for (let x = 0; x < W; x++) {
    for (let y = 0; y < H; y++) {
      if (d[(y*W + x) * 4] > 128) colInk[x]++;
    }
  }
  const minInk = Math.max(1, Math.floor(H * 0.04));
  const groups = [];
  let start = -1;
  for (let x = 0; x <= W; x++) {
    const on = x < W && colInk[x] >= minInk;
    if (on && start === -1) start = x;
    if (!on && start !== -1) { groups.push({ x0: start, x1: x }); start = -1; }
  }
  if (!groups.length) {
    els.statusMsg.textContent = '❌ ไม่พบตัวเลขในกรอบ';
    return;
  }

  // ---- 4. bbox แต่ละกลุ่ม + classifiy digit vs dot ----
  const items = groups.map(g => {
    let top = H, bottom = 0;
    for (let x = g.x0; x < g.x1; x++) {
      for (let y = 0; y < H; y++) {
        if (d[(y*W + x) * 4] > 128) {
          if (y < top) top = y;
          if (y > bottom) bottom = y;
        }
      }
    }
    return { ...g, y0: top, y1: bottom, h: bottom - top + 1 };
  });

  const maxDigitH = Math.max(...items.map(it => it.h));
  items.forEach(it => { it.isDot = it.h < maxDigitH * 0.5; });

  // ---- 5. template match แต่ละหลัก ----
  let result = '';
  let debug = [];
  for (const it of items) {
    if (it.isDot) { result += '.'; debug.push('.'); continue; }

    const c = document.createElement('canvas');
    c.width  = it.x1 - it.x0;
    c.height = it.h;
    const cctx = c.getContext('2d');
    cctx.drawImage(src, it.x0, it.y0, c.width, it.h, 0, 0, c.width, it.h);

    // re-binarize (ให้แน่ใจว่าเป็น 0/255)
    const cd = cctx.getImageData(0, 0, c.width, c.height);
    for (let i = 0; i < cd.data.length; i += 4) {
      const v = Math.max(cd.data[i], cd.data[i+1], cd.data[i+2]);
      const val = v > 128 ? 255 : 0;
      cd.data[i] = cd.data[i+1] = cd.data[i+2] = val;
    }
    cctx.putImageData(cd, 0, 0);

    const { digit, confidence } = recognizeDigit(c);
    result += digit;
    debug.push(`${digit}(${confidence.toFixed(2)})`);
  }

  // ---- 6. แสดง preview + ผลลัพธ์ ----
  els.cropCanvas.width  = W;
  els.cropCanvas.height = H;
  els.cropCanvas.getContext('2d').drawImage(src, 0, 0);
  els.cropCanvas.classList.remove('hidden');
  els.cropCanvas.style.display = 'block';
  els.cropCanvas.style.position = 'absolute';
  els.cropCanvas.style.inset = '0';
  els.cropCanvas.style.width = '100%';
  els.cropCanvas.style.height = '100%';
  els.cropCanvas.style.opacity = '0.6';
  els.cropCanvas.style.pointerEvents = 'none';

  const cleaned = result.replace(/[^0-9.]/g, '');
  if (/^\d+(\.\d+)?$/.test(cleaned)) {
    els.weightInput.value = cleaned;
    els.statusMsg.textContent = `✅ อ่านได้: ${cleaned}  (debug: ${debug.join(' ')})`;
  } else if (cleaned) {
    els.weightInput.value = cleaned;
    els.statusMsg.textContent = `⚠️ อ่านได้ไม่สมบูรณ์: "${cleaned}" (debug: ${debug.join(' ')})`;
  } else {
    els.statusMsg.textContent = '❌ อ่านไม่ได้ ลองปรับกรอบ/แสง';
  }
}

/* ---------- Events ---------- */
els.snapBtn.addEventListener('click', () => {
  isSnapped = true;
  els.video.pause();
  els.actionContainer.classList.add('hidden');
  els.retakeContainer.classList.remove('hidden');
  runTemplateMatching();
});

els.retakeBtn.addEventListener('click', () => {
  isSnapped = false;
  els.video.play().catch(() => {});
  els.cropCanvas.classList.add('hidden');
  els.cropCanvas.style.display = 'none';
  els.retakeContainer.classList.add('hidden');
  els.actionContainer.classList.remove('hidden');
  els.weightInput.value = '';
  els.statusMsg.textContent = '🔄 พร้อมถ่ายใหม่';
});

els.submitBtn.addEventListener('click', () => {
  const rv = parseFloat(els.weightInput.value);
  if (isNaN(rv) || rv <= 0) { alert('กรุณาระบุค่าน้ำหนักให้ถูกต้อง'); return; }
  const str = els.weightInput.value;
  const dp = str.includes('.') ? str.split('.')[1].length : 2;
  els.modalWeightValue.textContent = Math.abs(rv).toFixed(dp);
  els.successModal.classList.remove('hidden');
  els.successModal.classList.add('flex');
});
els.closeModalBtn.addEventListener('click', () => {
  els.successModal.classList.add('hidden');
  els.successModal.classList.remove('flex');
  els.retakeBtn.click();
});

updateRoiBoxStyle();
initCamera();
</script>
</body>
</html>
