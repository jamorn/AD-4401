<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto-Fill Scale OCR & Verify</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center p-4 select-none">

    <!-- Main Container -->
    <div class="w-full max-w-md bg-gray-900 p-6 rounded-2xl shadow-2xl border border-gray-800">
        <header class="flex items-center justify-between mb-4 border-b border-gray-800 pb-3">
            <h1 class="text-lg font-bold text-green-400 flex items-center gap-2">
                <span>⚖️</span> บันทึกน้ำหนักอัตโนมัติ
            </h1>
            <span id="scanStatus" class="text-xs font-mono bg-yellow-500/20 text-yellow-300 px-2.5 py-1 rounded-full border border-yellow-500/30 animate-pulse">
                🔍 กำลังสแกน...
            </span>
        </header>

        <!-- CAMERA & LIVE GUIDE BOX -->
        <div class="relative w-full aspect-[4/3] bg-black rounded-xl overflow-hidden border-2 border-gray-700 mb-5 shadow-inner flex flex-col items-center justify-center">
            <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
            
            <!-- กรอบเป้าหมาย (Target ROI Box) -->
            <div class="absolute inset-x-8 inset-y-1/3 border-2 border-dashed border-green-400 rounded-lg pointer-events-none flex items-end justify-center pb-1 bg-green-500/5">
                <span class="bg-black/80 text-green-300 text-[11px] px-2 py-0.5 rounded font-mono tracking-wide">
                    วางตัวเลขเครื่องชั่งในกรอบนี้
                </span>
            </div>
        </div>

        <!-- VERIFY & SUBMIT FORM -->
        <div class="flex flex-col gap-4">
            <div class="flex flex-col gap-1.5">
                <label for="weightInput" class="text-sm text-gray-300 font-medium flex justify-between">
                    <span>ค่าน้ำหนักที่อ่านได้ (ตรวจสอบก่อนกดส่ง):</span>
                    <span class="text-green-400 font-mono text-xs">หน่วย: kg</span>
                </label>
                <input 
                    type="number" 
                    id="weightInput" 
                    step="0.01" 
                    inputmode="decimal"
                    placeholder="รอค่านิ่ง..."
                    class="w-full text-4xl font-mono text-center bg-gray-950 border-2 border-green-500 rounded-xl py-3 px-4 text-green-300 font-bold focus:outline-none focus:ring-2 focus:ring-green-400"
                >
            </div>

            <button id="submitBtn" class="w-full bg-green-600 hover:bg-green-500 active:scale-[0.98] py-3.5 rounded-xl font-bold text-white transition shadow-lg text-lg flex items-center justify-center gap-2">
                <span>✅</span> ยืนยันส่งข้อมูล
            </button>
        </div>

        <p id="statusMsg" class="text-center text-xs text-gray-400 mt-4 font-mono min-h-[1rem]">
            หันกล้องไปที่หน้าจอเครื่องชั่ง ระบบจะดึงค่าอัตโนมัติเมื่อนิ่ง
        </p>
    </div>

    <!-- SUCCESS MODAL -->
    <div id="successModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl transform transition-all">
            <div class="w-16 h-16 bg-green-500/20 text-green-400 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl border border-green-500/30">
                ✓
            </div>
            <h2 class="text-xl font-bold text-white mb-2">บันทึกข้อมูลสำเร็จ</h2>
            <p class="text-gray-300 text-base mb-6">
                ค่าที่ส่งคือ <span id="modalWeightValue" class="text-2xl font-mono font-bold text-green-400 mx-1">0.00</span> kg
            </p>
            <button id="closeModalBtn" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl transition shadow-lg">
                ตกลง (เริ่มรอบถัดไป)
            </button>
        </div>
    </div>

    <!-- Canvas ซ่อนไว้สำหรับตัดภาพประมวลผล -->
    <canvas id="hiddenCanvas" class="hidden"></canvas>

    <script>
        const els = {
            video: document.getElementById('video'),
            hiddenCanvas: document.getElementById('hiddenCanvas'),
            weightInput: document.getElementById('weightInput'),
            statusMsg: document.getElementById('statusMsg'),
            scanStatus: document.getElementById('scanStatus'),
            submitBtn: document.getElementById('submitBtn'),
            successModal: document.getElementById('successModal'),
            modalWeightValue: document.getElementById('modalWeightValue'),
            closeModalBtn: document.getElementById('closeModalBtn')
        };

        let isDetected = false;

        // 1. เปิดกล้อง
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: 'environment' } }
                });
                els.video.srcObject = stream;
            } catch {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    els.video.srcObject = stream;
                } catch {
                    els.statusMsg.textContent = "⚠️ ไม่สามารถเปิดกล้องได้";
                }
            }
            // เริ่มจำลองกระบวนการสแกนอัตโนมัติทุกๆ 1.5 วินาที
            setInterval(autoScanLoop, 1500);
        }

        // 2. จำลอง Loop การสแกนอัตโนมัติ (Auto-Scan Background Loop)
        function autoScanLoop() {
            if (isDetected) return; // ถ้าจับค่าได้แล้ว ให้หยุดสแกนชั่วคราวรอให้คน Verify/Submit

            const video = els.video;
            if (!video.videoWidth) return;

            // จำลองการอ่านค่า OCR จากกรอบ (ในระบบจริง ตรงนี้นำภาพจาก Canvas ไปรัน OCR)
            // สมมติว่าเมื่อกล้องนิ่ง ระบบอ่านค่าได้ "91.30"
            const simulatedDetectedValue = "91.30"; 

            // เติมลง Input อัตโนมัติ
            els.weightInput.value = simulatedDetectedValue;
            isDetected = true;

            // เปลี่ยนสถานะ UI เป็นเจอค่าแล้ว
            els.scanStatus.textContent = "🎯 อ่านค่าสำเร็จ (โปรดตรวจสอบ)";
            els.scanStatus.className = "text-xs font-mono bg-green-500/20 text-green-300 px-2.5 py-1 rounded-full border border-green-500/30";
            els.statusMsg.textContent = "ตรวจสอบความถูกต้อง หากไม่ถูกให้ขยับกล้องส่องใหม่";
        }

        // 3. ปุ่มกด Submit
        function handleSubmit() {
            const rawValue = parseFloat(els.weightInput.value);
            if (isNaN(rawValue) || rawValue <= 0) {
                alert("กรุณารอระบบอ่านค่า หรือระบุค่าน้ำหนักให้ถูกต้อง");
                return;
            }

            const formattedWeight = rawValue.toFixed(2);
            els.modalWeightValue.textContent = formattedWeight;
            els.successModal.classList.remove('hidden');
            els.successModal.classList.add('flex');

            // TODO: ส่งค่า formattedWeight ไป Firebase ตรงนี้
        }

        // 4. ปิด Modal แล้วรีเซ็ตระบบให้พร้อมสแกนรอบใหม่
        function handleCloseModal() {
            els.successModal.classList.add('hidden');
            els.successModal.classList.remove('flex');
            
            // รีเซ็ตสถานะให้กลับไปสแกนใหม่
            isDetected = false;
            els.weightInput.value = "";
            els.scanStatus.textContent = "🔍 กำลังสแกน...";
            els.scanStatus.className = "text-xs font-mono bg-yellow-500/20 text-yellow-300 px-2.5 py-1 rounded-full border border-yellow-500/30 animate-pulse";
            els.statusMsg.textContent = "หันกล้องไปที่หน้าจอเครื่องชั่ง ระบบจะดึงค่าอัตโนมัติเมื่อนิ่ง";
        }

        els.submitBtn.addEventListener('click', handleSubmit);
        els.closeModalBtn.addEventListener('click', handleCloseModal);

        initCamera();
    </script>
</body>
</html>
